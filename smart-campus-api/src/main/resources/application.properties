spring.application.name=smart-campus-api
# ================================================================
# Smart Campus Operations Hub – application.properties
# IT3030 PAF Assignment 2026 | Module A: Assets Schema
# ================================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/api

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_campus_db
spring.datasource.username=postgres
spring.datasource.password=Harsha@2002
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; these make them explicit)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# validate = Hibernate checks your @Entity classes match the DB but never touches the schema.
# Use 'create-drop' only in early dev, never in production.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate which schema to use by default
spring.jpa.properties.hibernate.default_schema=assets

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Colombo

# --- Logging ---
logging.level.root=INFO
logging.level.lk.sliit.smartcampus=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- File Upload (Module C – incident attachments, max 3 images) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# --- OAuth2 / Google (Module E) ---
# Replace with your actual Google Cloud Console credentials
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- App custom properties ---
app.name=Smart Campus Operations Hub
app.version=1.0.0
app.jwt.secret=SmartCampus2026_SecureJWTSecretKey_DoNotCommit
app.jwt.expiration-ms=86400000
# File storage path for incident attachments
app.upload.dir=./uploads/incidents

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
