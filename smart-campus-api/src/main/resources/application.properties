spring.application.name=smart-campus-api

# ================================================================
# Smart Campus Operations Hub – application.properties
# IT3030 PAF Assignment 2026 | Module A: Assets Schema
# ================================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/api

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_campus_db
spring.datasource.username=postgres
spring.datasource.password=Harsha@2002
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; these make them explicit)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: allow multiple schemas (assets + auth)
spring.jpa.properties.hibernate.default_schema=public

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public,assets,auth
spring.flyway.baseline-on-migrate=true

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Colombo

# --- Logging ---
logging.level.root=INFO
logging.level.lk.sliit.smartcampus=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- File Upload (Module C – incident attachments, max 3 images) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# --- OAuth2 / Google (Module E) ---
# Replace with your actual Google Cloud Console credentials or environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- App custom properties ---
app.name=Smart Campus Operations Hub
app.version=1.0.0

# JWT (must match JwtService.java)
app.jwt.secret=12345678901234567890123456789012
app.jwt.expiration=3600000

# Frontend redirect (OAuth success/failure)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:8080/api}
app.auth.cookie-name=SC_AUTH_TOKEN
app.auth.cookie-path=/api
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax

# File storage path for incident attachments
app.upload.dir=./uploads/incidents

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
